# AeroSpace — i3-style tiling window manager.
# Symlinked to ~/.config/aerospace/aerospace.toml by linkall.sh.
# Syntax verified against AeroSpace's own default-config.toml and keysMap.swift.
#
# ── MODIFIER LAYERS (read before adding a binding) ───────────────────────────
#   Alt          belongs to the program in the pane (codex, editors). Never bind.
#   Ctrl+Alt     tmux + herdr pane/tab/workspace navigation. Never bind here:
#                AeroSpace grabs keys at the OS level, BEFORE iTerm sees them,
#                so a ctrl-alt binding here silently breaks tmux/herdr nav.
#   Hyper        AeroSpace. Hyper = cmd+alt+ctrl+shift, produced by HOLDING
#                Caps Lock (Karabiner rule; TAPPING Caps still switches EN/RU).
#
# Hyper uses all four modifiers, so there is no "shift variant" left for
# move-to-workspace. That lives in the `move` binding mode (Hyper+M) instead —
# the i3 way, and it keeps every chord one modifier deep.
#
# AeroSpace binds by key code, so bindings work with the Russian layout active.

config-version = 2

start-at-login = true
auto-reload-config = true           # edits to this file apply on save
after-startup-command = []

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Workspace changes announce themselves once here rather than annotating all
# nine bindings — this also covers Hyper+Tab and moves that change workspace.
exec-on-workspace-change = ['/bin/bash', '-c', '/Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Workspace $AEROSPACE_FOCUSED_WORKSPACE" ""']
automatically-unhide-macos-hidden-apps = false

# Nine workspaces, bound to Hyper+1..9. The default config declares 31; nothing
# here uses letters, so the rest would just be clutter in `list-workspaces`.
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

focus-follows-mouse.enabled = false
key-mapping.preset = 'qwerty'

# Dense, no gaps — same taste as the herdr sidebar.
gaps.inner.horizontal = 0
gaps.inner.vertical   = 0
gaps.outer.left       = 0
gaps.outer.bottom     = 0
gaps.outer.top        = 0
gaps.outer.right      = 0

# Apps that should float instead of tile. MUST sit above the first [table]
# header: TOML scopes every key after a header into that table, so placed at
# the bottom this silently became mode.service.binding.on-window-detected and
# AeroSpace never saw it. Dialogs already float via AeroSpace's own heuristic;
# this list is for whole apps.
#
# Starter list — expect to add a few in
# the first days; `aerospace list-apps` prints the bundle id of anything running.
# Raycast's own Center / Reasonable Size commands handle placing these.
on-window-detected = [
    { if.app-id = 'com.1password.1password',           run = 'layout floating' },
    { if.app-id = 'com.raycast.macos',                 run = 'layout floating' },
    { if.app-id = 'com.apple.systempreferences',       run = 'layout floating' },
    { if.app-id = 'com.apple.finder',                  run = 'layout floating' },
    { if.app-id = 'us.zoom.xos',                       run = 'layout floating' },
    { if.app-id = 'com.robinebers.openusage',          run = 'layout floating' },
    { if.app-id = 'org.hammerspoon.Hammerspoon',       run = 'layout floating' },
    { if.app-id = 'org.pqrs.Karabiner-Elements.Settings', run = 'layout floating' },
    { if.app-id = 'com.apple.calculator',              run = 'layout floating' },
    { if.app-id = 'com.apple.QuickTimePlayerX',        run = 'layout floating' },
    { if.app-id = 'com.obsproject.obs-studio',         run = 'layout floating' },
    { if.app-id = 'com.manytricks.Moom',               run = 'layout floating' },  # during the Moom trial-removal only

    # Added from what was actually running at first launch — utility/overlay
    # windows that tiling makes worse rather than better.
    { if.app-id = 'com.granola.app',                   run = 'layout floating' },  # meeting-note overlay
    { if.app-id = 'com.flexibits.fantastical2.mac',    run = 'layout floating' },  # calendar popover
    { if.app-id = 'com.apple.MobileSMS',               run = 'layout floating' },  # Messages
    { if.app-id = 'com.apple.Keynote',                 run = 'layout floating' },  # presenting beats tiling

    # The cheat-sheet window (Hyper+/) — float it instead of tiling it over the
    # workspace you opened it from. Matched by title because it is an ordinary
    # iTerm window; the script sets that title explicitly.
    { if.app-id = 'com.brettterpstra.marked-setapp',   run = 'layout floating' },  # cheat sheet (AERO /) — Setapp Marked
]

# Leader, not a held modifier. Karabiner turns a TAP of right Shift into f18;
# holding it still types Shift. Nothing to hold while pressing the action key,
# and because Shift is no longer eaten by the modifier, move-variants are just
# shifted letters — no second mode for move-to-workspace.
[mode.main.binding]
    f18 = ['mode aero', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "AERO" "hjkl focus · ⇧ moves · 1-9 workspace · esc"']

# aero mode — bare keys, one action then straight back to main. Resize stays in
# the mode, because repeating is the whole point there. esc leaves without acting.
[mode.aero.binding]
    esc = ['mode main', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "" ""']
    h = ['focus left', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Focus ←" "h"', 'mode main']
    j = ['focus down', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Focus ↓" "j"', 'mode main']
    k = ['focus up', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Focus ↑" "k"', 'mode main']
    l = ['focus right', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Focus →" "l"', 'mode main']
    shift-h = ['move left', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Move ←" "⇧H"', 'mode main']
    shift-j = ['move down', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Move ↓" "⇧J"', 'mode main']
    shift-k = ['move up', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Move ↑" "⇧K"', 'mode main']
    shift-l = ['move right', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Move →" "⇧L"', 'mode main']
    1 = ['workspace 1', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Workspace 1" "1"', 'mode main']
    2 = ['workspace 2', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Workspace 2" "2"', 'mode main']
    3 = ['workspace 3', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Workspace 3" "3"', 'mode main']
    4 = ['workspace 4', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Workspace 4" "4"', 'mode main']
    5 = ['workspace 5', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Workspace 5" "5"', 'mode main']
    6 = ['workspace 6', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Workspace 6" "6"', 'mode main']
    7 = ['workspace 7', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Workspace 7" "7"', 'mode main']
    8 = ['workspace 8', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Workspace 8" "8"', 'mode main']
    9 = ['workspace 9', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Workspace 9" "9"', 'mode main']
    shift-1 = ['move-node-to-workspace 1', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Send → workspace 1" "⇧1"', 'mode main']
    shift-2 = ['move-node-to-workspace 2', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Send → workspace 2" "⇧2"', 'mode main']
    shift-3 = ['move-node-to-workspace 3', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Send → workspace 3" "⇧3"', 'mode main']
    shift-4 = ['move-node-to-workspace 4', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Send → workspace 4" "⇧4"', 'mode main']
    shift-5 = ['move-node-to-workspace 5', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Send → workspace 5" "⇧5"', 'mode main']
    shift-6 = ['move-node-to-workspace 6', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Send → workspace 6" "⇧6"', 'mode main']
    shift-7 = ['move-node-to-workspace 7', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Send → workspace 7" "⇧7"', 'mode main']
    shift-8 = ['move-node-to-workspace 8', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Send → workspace 8" "⇧8"', 'mode main']
    shift-9 = ['move-node-to-workspace 9', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Send → workspace 9" "⇧9"', 'mode main']
    tab = ['workspace-back-and-forth', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Previous workspace" "tab"', 'mode main']
    f = ['fullscreen', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Fullscreen" "f"', 'mode main']
    space = ['layout floating tiling', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Float ↔ tile" "space"', 'mode main']
    comma = ['layout tiles horizontal vertical', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Layout: tiles" ","', 'mode main']
    period = ['layout accordion horizontal vertical', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Layout: accordion" "."', 'mode main']
    leftSquareBracket = ['move-node-to-monitor --wrap-around left', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "To display ←" "["', 'mode main']
    rightSquareBracket = ['move-node-to-monitor --wrap-around right', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "To display →" "]"', 'mode main']
    r = ['flatten-workspace-tree', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Reset layout" "r"', 'mode main']
    backspace = ['close-all-windows-but-current', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Closed all but current" "⌫"', 'mode main']
    minus = ['resize smart -50', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Shrink" "-"']
    equal = ['resize smart +50', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Grow" "="']
    b = ['balance-sizes', 'exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-hud.sh "Balance" "b"']
    slash = ['exec-and-forget /Users/vikgamov/projects/dotfiles/aerospace/aerospace-help.sh', 'mode main']
