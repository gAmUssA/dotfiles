onboarding = false
# herdr configuration — mirrors ~/.tmux.conf muscle memory where herdr allows.
# Symlinked to ~/.config/herdr/config.toml by linkall.sh.
# Apply changes to a running server: herdr server reload-config
# Validate: herdr config check

[theme]
# Matches the Dracula tmux theme.
name = "dracula"

auto_switch = false
[keys]
# Same prefix as tmux (Ctrl-Space).
prefix = "ctrl+space"

# Splits: tmux `prefix |` (side-by-side) and `prefix _` (stacked).
# herdr's split_vertical = new pane to the RIGHT, split_horizontal = BELOW,
# so the tmux glyphs map straight across. Defaults v/minus kept as fallbacks.
split_vertical = ["prefix+v", "prefix+shift+backslash"]
split_horizontal = ["prefix+minus", "prefix+shift+minus"]

# tmux rebinds `prefix x` from kill-pane to zoom; same here. `prefix z` kept.
# Pane close moves to shift+x's neighborhood — but shift+x is close_tab, so
# close_pane gets shift+q (panes die via exit/Ctrl-D anyway, as in tmux).
zoom = ["prefix+z", "prefix+x"]
close_pane = "prefix+shift+q"

# Direct pane navigation without prefix, like tmux Alt+arrows.
focus_pane_left = ["prefix+h", "alt+left"]
focus_pane_down = ["prefix+j", "alt+down"]
focus_pane_up = ["prefix+k", "alt+up"]
focus_pane_right = ["prefix+l", "alt+right"]

# Outer navigation, like tmux Shift+Alt+arrows:
# horizontal = tabs (tmux windows), vertical = workspaces (tmux sessions).
previous_tab = ["prefix+p", "alt+shift+left"]
next_tab = ["prefix+n", "alt+shift+right"]
previous_workspace = "alt+shift+up"
next_workspace = "alt+shift+down"

# Resize with the tmux chords (prefix + C-h/j/u/l), no resize mode needed.
resize_pane_left = "prefix+ctrl+h"
resize_pane_down = "prefix+ctrl+j"
resize_pane_up = "prefix+ctrl+u"
resize_pane_right = "prefix+ctrl+l"

# Bounce to the last pane (tmux: double-prefix last-window). herdr reserves
# double-prefix for sending a literal Ctrl-Space, so it lives on prefix+space.
last_pane = "prefix+space"

# Fuzzy goto picker on `o`, matching tmux sessionx; frees `g` for lazygit.
goto = "prefix+o"

# Rename pane on `t` like tmux; default shift+p kept as fallback.
rename_pane = ["prefix+shift+p", "prefix+t"]

# Lazygit popup — tmux `prefix g`, scoped to the focused pane's cwd.
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"
description = "lazygit"

# Ephemeral shell peek — tmux `prefix Enter`. Exit/Ctrl-D closes it.
[[keys.command]]
key = "prefix+enter"
type = "popup"
command = "exec \"${SHELL:-sh}\""
width = "80%"
height = "80%"
description = "shell peek"

# Claude Code — tmux `prefix y` opened a per-directory popup session.
# herdr popups die with the popup, so open claude in a temporary zoomed pane
# instead: it survives focus changes, and the sidebar tracks its state.
[[keys.command]]
key = "prefix+y"
type = "pane"
command = "claude"
description = "claude here"

[ui]
# Small status area on the tab bar: zoom pill + military time (Dracula habit).
tab_bar_right = [
  { type = "zoom" },
  { type = "datetime", format = "%H:%M" },
]
agent_panel_sort = "spaces"

show_agent_labels_on_pane_borders = true

# Agent sidebar rows, FleetView-style. Herdr joins adjacent tokens with `·`
# (missing values and their separator vanish), so entries render as:
#   ◐ claude · lead · fable-5
#   working · dotfiles · reviewing the diff
# `agent` shows the detected name until renamed (herdr agent rename w1:p1
# lead). $role/$model are metadata tokens (herdr pane report-metadata; $model
# fed by herdr-model-report.sh) and drop out when unreported. state_text keeps
# its per-state color.
#
# Density: 2 lines per agent, no blank separator — was 3 rows + row_gap = 1,
# i.e. 4 lines each, which with 8 agents ran past a screen and made the list
# need scrolling to answer "who needs me". Halved to 2 lines by folding the
# summary onto the state line. The state icon and its color still start every
# entry, so rows stay scannable without the blank line to separate them.
# Bump row_gap back to 1 if entries start running together.
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "agent", "$role", { token = "$model", dim = true }],
  [
    { token = "state_text", bold = true },
    { token = "tab", dim = true },
    { token = "$summary", dim = true },
  ],
]

# Space (workspace) rows are already 2 lines; keep them tight to match.
[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  [{ token = "branch", dim = true }, { token = "git_status", dim = true }],
]

[ui.toast]
# "off" because herdr-plugins/notify owns desktop banners now. Leaving this on
# would double-fire whenever a client IS attached: the plugin banner plus this
# one, for the same state change.
#
# The plugin is strictly better as the single notifier — these built-in toasts
# need an attached, FOREGROUND client (`herdr notification show` returns
# {"shown":false,"reason":"no_foreground_client"} when detached), so they go
# silent in exactly the always-on-host case where a notification matters most.
# The plugin runs server-side and has no such gate.
delivery = "off"

[experimental]
kitty_graphics = true
